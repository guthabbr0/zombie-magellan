<canvas id=c width=512 height=512></canvas>
<script>
const gl=document.getElementById('c').getContext('webgl2');
const vs=`#version 300 es
layout(location=0) in vec2 aP; out vec2 vUV; void main(){ vUV=aP*0.5+0.5; gl_Position=vec4(aP,0,1);} `;
const fs=`#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3 voroT(vec2 p, float per){ vec2 i = floor(p), f = fract(p); float f1 = 8.0, f2 = 8.0, id = 0.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 g = vec2(float(x),float(y)); vec2 o = hash22(mod(i+g, per)); vec2 r = g + o - f; float d = dot(r,r);
    if(d < f1){ f2 = f1; f1 = d; id = hash12(mod(i+g, per)); } else if(d < f2) f2 = d; }
  return vec3(sqrt(f1), sqrt(f2), id); }
void main(){ vec2 p = fract(vUV*4.0); vec2 cell = floor(vUV*4.0);
  vec3 vr = voroT(p*5.0 + cell*3.0 + 1.0, 5.0);
  float wound = smoothstep(0.22, 0.08, vr.x)*step(0.82, vr.z);
  // also show raw id
  o = vec4(wound, vr.z, step(0.82, vr.z)*0.5, 1.0); }`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.log(gl.getShaderInfoLog(x));return x;}
const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);
// count hash distribution
const px=new Uint8Array(512*512*4); gl.readPixels(0,0,512,512,gl.RGBA,gl.UNSIGNED_BYTE,px); let hi=0,n=0; for(let i=0;i<px.length;i+=4){ if(px[i+2]>0)hi++; n++; } window.result={fracHigh:hi/n};
</script>
